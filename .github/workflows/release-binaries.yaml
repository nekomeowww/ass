name: Release Binaries

on:
  release:
    types:
      - prereleased

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            archive: ass-aarch64-apple-darwin.tar.gz
            executable: ass
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: ass-x86_64-apple-darwin.tar.gz
            executable: ass
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: ass-x86_64-unknown-linux-gnu.tar.gz
            executable: ass
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: ass-aarch64-unknown-linux-gnu.tar.gz
            executable: ass
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ass-x86_64-pc-windows-msvc.zip
            executable: ass.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build executable
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Decode macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE }}
        run: printf "%s" "$APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE" | base64 --decode > ass-developer-id-application.p12

      - name: Create macOS signing keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ass-signing "$RUNNER_TEMP/ass-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ass-signing.keychain-db"
          security unlock-keychain -p ass-signing "$RUNNER_TEMP/ass-signing.keychain-db"

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          security import ass-developer-id-application.p12 -P "$APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/ass-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ass-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ass-signing "$RUNNER_TEMP/ass-signing.keychain-db"

      - name: Sign macOS executable
        if: runner.os == 'macOS'
        run: |
          identity="$(security find-identity -v -p codesigning "$RUNNER_TEMP/ass-signing.keychain-db" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          test -n "$identity"
          codesign --force --timestamp --options runtime \
            --sign "$identity" \
            target/${{ matrix.target }}/release/${{ matrix.executable }}
          codesign --verify --deep --strict --verbose=2 \
            target/${{ matrix.target }}/release/${{ matrix.executable }}

      - name: Clean up macOS signing keychain
        if: runner.os == 'macOS' && always()
        run: security delete-keychain "$RUNNER_TEMP/ass-signing.keychain-db" || true

      - name: Verify executable
        run: target/${{ matrix.target }}/release/${{ matrix.executable }} --help

      - name: Create archive
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.executable }}

      - name: Create archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.executable }}" -DestinationPath "${{ matrix.archive }}"

      - name: Calculate hash
        if: runner.os != 'Windows'
        run: shasum -a 256 ${{ matrix.archive }} | awk '{ print $1 }' > ${{ matrix.archive }}.sha256

      - name: Calculate hash
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-Content -Path "${{ matrix.archive }}.sha256" -Value (Get-FileHash -Algorithm SHA256 "${{ matrix.archive }}").Hash.ToLower()

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  notarize-macos:
    name: Notarize macOS ${{ matrix.archive }}
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - archive: ass-aarch64-apple-darwin.tar.gz
          - archive: ass-x86_64-apple-darwin.tar.gz

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.archive }}

      - name: Set up notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials ass-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Submit executable for notarization
        run: |
          set -euo pipefail
          tar -xzf ${{ matrix.archive }}
          zip ass-notary.zip ass
          xcrun notarytool submit ass-notary.zip --keychain-profile ass-notary --wait
          ./ass --help
          tar -czf ${{ matrix.archive }} ass
          shasum -a 256 ${{ matrix.archive }} | awk '{ print $1 }' > ${{ matrix.archive }}.sha256

      - name: Upload notarized macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: notarized-${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  publish:
    name: Publish release artifacts
    needs: [build, notarize-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prefer notarized macOS archives
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name 'ass-*' -o -name '*.sha256' \) -print0 | while IFS= read -r -d '' file; do
            case "$file" in
              artifacts/notarized-*/*)
                cp "$file" release/
                ;;
              *apple-darwin*)
                if [ ! -e "release/$(basename "$file")" ]; then
                  cp "$file" release/
                fi
                ;;
              *)
                cp "$file" release/
                ;;
            esac
          done

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/* --clobber --repo "$GITHUB_REPOSITORY"
