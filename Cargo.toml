[package]
name = "ass"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Already Shipped JS: run JavaScript and TypeScript in the system WebView"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nekomeowww/wry-js"

[features]
default = ["typescript"]
typescript = [
  "dep:oxc_allocator",
  "dep:oxc_ast",
  "dep:oxc_codegen",
  "dep:oxc_diagnostics",
  "dep:oxc_parser",
  "dep:oxc_semantic",
  "dep:oxc_span",
  "dep:oxc_transformer",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
oxc_allocator = { version = "0.142", optional = true }
oxc_ast = { version = "0.142", optional = true }
oxc_codegen = { version = "0.142", default-features = false, optional = true }
oxc_diagnostics = { version = "0.142", optional = true }
oxc_parser = { version = "0.142", optional = true }
oxc_semantic = { version = "0.142", optional = true }
oxc_span = { version = "0.142", optional = true }
oxc_transformer = { version = "0.142", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
wry = { version = "0.56", default-features = false, features = ["os-webview"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
